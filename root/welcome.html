<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWebServer - 控制大厅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: url('background.png'); 
            background-size: cover;      
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* 欢迎大厅卡片 */
        .welcome-card {
            background: rgba(0, 0, 0, 0.45); 
            backdrop-filter: blur(15px);     
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 60px 70px;
            width: 450px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 0.8s ease-out; 
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); 
        }

        /* 按钮组采用纵向 Flex 布局 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px; /* 按钮之间的垂直间距 */
        }

        /* 通用按钮样式：未悬浮时保持一致的低调质感 */
        button {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.08); 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        /* 选项 1：架构展示（青色悬浮） */
        .btn-pic:hover {
            background: rgba(0, 255, 204, 0.8);
            color: #121212;
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transform: translateY(-3px);
        }

        /* 选项 2：视频演示（蓝色悬浮） */
        .btn-vid:hover {
            background: rgba(0, 122, 204, 0.8);
            border-color: #007acc;
            box-shadow: 0 0 20px rgba(0, 122, 204, 0.5);
            transform: translateY(-3px);
        }

        /* 选项 3：关注作者（红色悬浮） */
        .btn-fans:hover {
            background: rgba(255, 77, 77, 0.8);
            border-color: #ff4d4d;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>是时候做出选择了</h1>
        
        <div class="btn-group">
            <form action="picture.html" method="post">
                <button type="submit" class="btn-pic">项目架构展示 (图片)</button>
            </form>
            
            <form action="video.html" method="post">
                <button type="submit" class="btn-vid">系统功能演示 (视频)</button>
            </form>
            
            <form action="fans.html" method="post">
                <button type="submit" class="btn-fans">关于开发者 (关注我)</button>
            </form>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWebServer - 欢迎页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 右上角优雅的退出按钮 */
        .exit-btn {
            position: absolute;
            top: 40px;
            right: 50px;
            padding: 10px 25px;
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.4);
            border-radius: 30px;
            color: #ff4d4d;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .exit-btn:hover {
            background: rgba(255, 77, 77, 0.9);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
            transform: translateY(-2px);
        }

        /* 欢迎标题区 */
        .header-section {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header-section h1 {
            font-size: 3rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .header-section p {
            font-size: 1.2rem;
            color: #f3ecec;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* 功能卡片容器 */
        .cards-container {
            display: flex;
            gap: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            /* 带有0.2s延迟的出场动画 */
        }

        /* 玻璃拟态卡片设计 */
        .nav-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: 320px;
            height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 卡片悬浮发光效果 */
        .nav-card:hover {
            transform: translateY(-15px);
            border-color: #00ffcc;
            box-shadow: 0 20px 40px rgba(0, 255, 204, 0.25), 0 0 20px rgba(0, 255, 204, 0.1) inset;
        }

        /* 伪元素：卡片右上角的微光反射 */
        .nav-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .nav-card:hover::before {
            left: 100%;
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 25px;
            /* 给 Emoji 增加一层辉光 */
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.4));
            transition: transform 0.3s;
        }

        .nav-card:hover .icon {
            transform: scale(1.1);
        }

        .nav-card h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            color: #00ffcc;
        }

        .nav-card p {
            font-size: 0.95rem;
            color: #aaaaaa;
            line-height: 1.6;
        }

        /* 动画定义 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <a href="log.html" class="exit-btn">退出登录</a>

    <div class="header-section">
        <h1>中央控制台</h1>
        <p>TinyWebServer 高性能服务器管理系统</p>
    </div>

    <div class="cards-container">
        <a href="frame.html" class="nav-card">
            <div class="icon">📊</div>
            <h2>项目架构图</h2>
            <p>探索底层逻辑，查看最小堆定时器、线程池及弹性缓冲区的数据流向设计。</p>
        </a>

        <a href="ai.html" class="nav-card">
            <div class="icon">🌌</div>
            <h2>AI 工具导航</h2>
            <p>汇聚全球顶尖 AI 模型引擎，为您提供全方位的智能助手直达链接。</p>
        </a>
    </div>

</body>

</html>

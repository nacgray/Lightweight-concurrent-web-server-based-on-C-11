<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWebServer - 系统登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 登录卡片 */
        .login-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 60px;
            width: 400px;
            /* 固定宽度让表单更美观 */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* 现代化的输入框设计 */
        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            /* 极度透明的背景 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* 淡淡的白边 */
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        /* 占位符颜色 */
        input::placeholder {
            color: #aaaaaa;
        }

        /* 输入框聚焦时的发光效果 */
        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #007acc;
            box-shadow: 0 0 15px rgba(0, 122, 204, 0.4);
        }

        /* 登录按钮 */
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            letter-spacing: 2px;
            background: rgba(0, 122, 204, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: rgba(0, 122, 204, 1);
            box-shadow: 0 0 20px rgba(0, 122, 204, 0.6);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>系统登录</h1>

        <form action="login.cgi" method="post">
            <div class="input-group">
                <input type="text" name="user" placeholder="请输入用户名" required="required" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="请输入登录密码" required="required">
            </div>
            <button type="submit">确 定</button>
        </form>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWebServer - 系统注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 加深了面板的背景不透明度，提升文字对比度 */
        .register-card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 50px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            transition: transform 0.1s;
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #ffffff;
            /* 增强文字阴影，防止亮色背景吞噬字体 */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .input-group {
            margin-bottom: 18px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            /* 输入框底色改为暗色调，以衬托白色字体 */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        /* 占位符颜色稍微调亮一点，确保在暗色输入框中可见 */
        input::placeholder {
            color: #cccccc;
        }

        input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            letter-spacing: 4px;
            background: rgba(0, 255, 204, 0.7);
            color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-shadow: none;
            /* 按钮字用深色，不需要阴影 */
        }

        button:hover {
            background: rgba(0, 255, 204, 1);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            transform: translateY(-2px);
        }

        #error-message {
            margin-top: 20px;
            color: #ff4d4d;
            font-size: 0.9rem;
            font-weight: bold;
            display: none;
            text-align: left;
            line-height: 1.5;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
            /* 让错误提示在亮背景下更醒目 */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-8px);
            }
        }
    </style>
</head>

<body>

    <div class="register-card" id="card-container">
        <h1>新用户注册</h1>

        <form action="register.cgi" method="post" onsubmit="return validateForm()">
            <div class="input-group">
                <input type="text" id="username" name="user" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="请输入注册密码">
            </div>
            <div class="input-group">
                <input type="password" id="re_password" placeholder="请再次输入密码以确认">
            </div>
            <button type="submit">注 册</button>
        </form>

        <div id="error-message"></div>
    </div>

    <script>
        function validateForm() {
            const user = document.getElementById('username').value;
            const psw = document.getElementById('password').value;
            const re_psw = document.getElementById('re_password').value;
            const errMsg = document.getElementById('error-message');
            const card = document.getElementById('card-container');

            function triggerError(msg) {
                errMsg.innerHTML = "⚠️ 提示：<br>" + msg;
                errMsg.style.display = 'block';
                card.classList.remove('shake-animation');
                void card.offsetWidth;
                card.classList.add('shake-animation');
            }

            // 1. 非空检查
            if (!user.trim() || !psw || !re_psw) {
                triggerError("所有字段均为必填项！");
                return false;
            }

            // 2. 用户名校验
            // 规则：两个汉字或四个英文字母以上
            // 实现逻辑：遍历字符串，遇到ASCII范围外的字符（如中文）记长度为2，普通英文字符记为1。总长度必须 >= 4。
            let userLength = 0;
            for (let i = 0; i < user.length; i++) {
                userLength += (user.charCodeAt(i) > 255) ? 2 : 1;
            }
            if (userLength < 4) {
                triggerError("用户名长度不足！<br>需至少包含2个汉字或4个英文字母。");
                return false;
            }

            // 3. 密码复杂度校验
            // 正则解释：
            // ^              : 匹配字符串开始
            // (?=.*[a-zA-Z]) : 正向先行断言（Lookahead），确保后面存在至少一个字母（大小写不限）
            // (?=.*\d)       : 正向先行断言，确保后面存在至少一个数字
            // .{8,}          : 匹配任意字符（包含特殊字符），至少出现 8 次
            // $              : 匹配字符串结束
            const pwdRegex = /^(?=.*[a-zA-Z])(?=.*\d).{8,}$/;
            if (!pwdRegex.test(psw)) {
                triggerError("密码强度不达标！<br>• 长度至少为 8 位<br>• 必须同时包含数字和英文（允许特殊字符）");
                return false;
            }

            // 4. 两次密码一致性校验
            if (psw !== re_psw) {
                triggerError("两次输入的密码不一致！");
                return false;
            }

            errMsg.style.display = 'none';
            return true;
        }
    </script>
</body>

</html>

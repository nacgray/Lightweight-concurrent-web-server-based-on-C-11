<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>架构指挥中心</title>
    <style>
        body { background-color: #1a1a1a; color: white; text-align: center; font-family: sans-serif; }
        .btn-group { margin: 20px; padding: 15px; background: #333; border-radius: 10px; display: inline-block; }
        button { padding: 12px 24px; cursor: pointer; background: #007acc; color: white; border: none; margin: 5px; border-radius: 5px; font-weight: bold; }
        button:hover { background: #005999; }
        .screen { margin-top: 20px; border: 3px solid #444; display: inline-block; padding: 10px; background: #000; border-radius: 8px; }
        img { max-width: 900px; height: auto; border: 1px solid #222; }
        #desc { margin-top: 10px; font-style: italic; color: #aaa; }
    </style>
</head>
<body>
    <h1>🚀 TinyWebServer 核心模块架构总览</h1>
    
    <div class="btn-group">
        <button onclick="show('frame.jpg', '项目整体 EventLoop 与 Reactor 模式流程图')">项目总览</button>
        <button onclick="show('threadpool.jpg', '基于互斥锁与条件变量的工作线程池模型')">线程池</button>
        <button onclick="show('http_parser.jpg', '主从状态机解析 HTTP 报文逻辑图')">HTTP 解析</button>
        <button onclick="show('log_system.jpg', '异步日志系统与阻塞队列流程图')">日志系统</button>
    </div>

    <br/>
    <div class="screen">
        <img id="main-img" src="frame.jpg" alt="请确保图片已放入 root 目录">
        <div id="desc">当前展示：项目整体 EventLoop 与 Reactor 模式流程图</div>
    </div>

    <script>
        function show(imgName, text) {
            // 浏览器会自动向后端发起 GET /imgName 的请求
            // 后端 http_conn::do_request 里的 else 分支会通过 mmap 直接下发图片
            document.getElementById('main-img').src = imgName;
            document.getElementById('desc').innerText = "当前展示：" + text;
        }
    </script>
</body>
</html>
